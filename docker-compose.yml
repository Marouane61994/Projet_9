
services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: patientdb
      MYSQL_USER: medilabo
      MYSQL_PASSWORD: medipass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - medilabo-net

  back:
    build: ./microservice-back
    container_name: microservice-back
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/patientdb
      SPRING_DATASOURCE_USERNAME: medilabo
      SPRING_DATASOURCE_PASSWORD: medipass
    ports:
      - "8081:8081"
    network_mode: "host"

  front:
    build: ./microservice-front
    container_name: microservice-front
    restart: always
    depends_on:
      - gateway
    ports:
      - "8082:8082"
    network_mode: "host"

  gateway:
    build: ./microservice-gateway
    container_name: microservice-gateway
    restart: always
    depends_on:
      - back
    ports:
      - "8083:8083"
    network_mode: "host"

  notes:
    build: ./microservice-notes
    container_name: microservice-notes
    restart: always
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/notesdb
      SPRING_APPLICATION_NAME: note-services
    ports:
      - "8084:8084"
    networks:
      - medilabo-net

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medilabo-net


volumes:
  db_data:
  mongo_data:

networks:
  medilabo-net:
    driver: bridge