server:
  port: 8083

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8086
          predicates:
            - Path=/patient-service/**
          filters:
            - StripPrefix=1




management:
  endpoints:
    web:
      exposure:
        include: "*"
