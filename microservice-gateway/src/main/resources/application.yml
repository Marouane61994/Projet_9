server:
  port: 8083

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8081
          predicates:
            - Path=/patient-service/**
          filters:
            - StripPrefix=1

        - id: note-service
          uri: http://localhost:8085
          predicates:
            - Path=/note-service/**
          filters:
            - StripPrefix=1

        - id: diabetes-service
          uri: http://localhost:8084
          predicates:
            - Path=/diabetes-service/**
          filters:
            - StripPrefix=1

internal:
  base-url: http://localhost


management:
  endpoints:
    web:
      exposure:
        include: "*"
