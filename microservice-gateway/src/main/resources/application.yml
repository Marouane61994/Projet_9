server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: ${PATIENTS_SERVICE_URL}
          predicates:
            - Path=/patients-service/**
          filters:
            - StripPrefix=1

        - id: note-service
          uri: ${NOTES_SERVICE_URL}
          predicates:
            - Path=/notes-service/**
          filters:
            - StripPrefix=1

        - id: diabetes-service
          uri: ${DIABETES_SERVICE_URL}
          predicates:
            - Path=/diabetes-service/**
          filters:
            - StripPrefix=1

internal:
  base-url: ${GATEWAY_SERVICE_URL}

auth:
  gateway:
    username: ${AUTH_GATEWAY_USERNAME}
    password: ${AUTH_GATEWAY_PASSWORD}
  patient:
    username: ${AUTH_PATIENTS_USERNAME}
    password: ${AUTH_PATIENTS_PASSWORD}
  note:
    username: ${AUTH_NOTES_USERNAME}
    password: ${AUTH_NOTES_PASSWORD}
  diabetes:
    username: ${AUTH_DIABETES_USERNAME}
    password: ${AUTH_DIABETES_PASSWORD}