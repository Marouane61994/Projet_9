server:
  port: 8083

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        # Route vers le service patient
        - id: patient-service
          uri: http://patient-service:8085
          predicates:
            - Path=/patient-service/**
          filters:
            - StripPrefix=1


        # Route vers le front (Thymeleaf)
        - id: front
          uri: http://front:8082
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
