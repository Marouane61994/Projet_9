server:
  port: ${BACKEND_PORT}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
    open-in-view: false
    properties:
     hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: true
      data-locations: classpath:data.sql
      jpa.defer-datasource-initialization: true

auth:
  patient:
    username: ${AUTH_PATIENTS_USERNAME}
    password: ${AUTH_PATIENTS_PASSWORD}
