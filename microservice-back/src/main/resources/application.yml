server:
  port: 8081

spring:
  datasource:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:patientdb}?allowPublicKeyRetrieval=true&useSSL=false
      username: ${MYSQL_USER:medilabo}
      password: ${MYSQL_PASSWORD:medipass}
      driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always
      continue-on-error: true
      data-locations: classpath:data.sql
      defer-datasource-initialization: true

auth:
  patient:
    username: ${AUTH_PATIENT_USERNAME:technical_user_patient}
    password: ${AUTH_PATIENT_PASSWORD:password}
