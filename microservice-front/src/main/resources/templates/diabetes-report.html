<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rapport de Risque de Diabète</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        <style>
       /* Aucun risque (Vert) */
       .risk-none {
           color: #38761D; /* Vert foncé */
           font-weight: bold;
       }

       /* Risque limité (Orange clair) */
       .risk-borderline {
           color: #E69138; /* Orange standard */
           font-weight: bold;
       }

       /* Danger (Orange Foncé, plus proche du Rouge) */
       .risk-in-danger {
           color: #CC6600; /* Orange Brûlé / Foncé */
           font-weight: bold;
       }

       /* Apparition précoce (Rouge Vif/Urgent) */
       .risk-early-onset {
           color: #990000; /* Rouge profond/vif */
           font-weight: bold;
       }
    </style>
</head>
<body class="bg-light">
<div class="container my-5">

    <h1 class="text-center text-primary mb-4">Rapport d'Évaluation du Risque de Diabète</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${report != null}" class="card shadow-sm p-4 mb-4">
        <h2 th:text="${report.prenom + ' ' + report.nom}" class="mb-3"></h2>
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>ID Patient :</strong> <span th:text="${report.patientId}"></span></li>
            <li class="list-group-item"><strong>Sexe :</strong> <span th:text="${report.genre}"></span></li>
            <li class="list-group-item"><strong>Date de naissance :</strong> <span th:text="${report.dateNaissance}"></span></li>
            <li class="list-group-item"><strong>Âge :</strong> <span th:text="${report.age}"></span></li>
            <li class="list-group-item"><strong>Nombre de déclencheurs :</strong> <span th:text="${report.nombreDeclencheurs}"></span></li>
            <li class="list-group-item">
                <strong>Niveau de risque :</strong>
                <span th:text="${report.niveauRisque}"
                      th:classappend="'risk-' + ${report.niveauRisque.toLowerCase().replace(' ', '-')}"></span>
            </li>
        </ul>
    </div>

    <div class="text-center">
        <a th:href="@{/patients}" class="btn btn-primary">← Retour à la liste des patients</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
