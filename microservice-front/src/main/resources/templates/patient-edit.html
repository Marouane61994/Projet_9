<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier un Patient</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Supprimer une note via AJAX
        function deleteNote(noteId) {
            fetch('/api/notes/' + noteId, { method: 'DELETE' })
            .then(response => {
                if (response.status === 204) {
                    alert('Note supprimée');
                    location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            });
        }
    </script>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Modifier le Patient</h2>

    <form th:action="@{'/patients/' + ${patient.id} + '/edit'}" method="post" th:object="${patient}" class="row g-3">
        <div class="col-md-6">
            <label for="prenom" class="form-label">Prénom :</label>
            <input type="text" th:field="*{prenom}" class="form-control" id="prenom" required>
        </div>

        <div class="col-md-6">
            <label for="nom" class="form-label">Nom :</label>
            <input type="text" th:field="*{nom}" class="form-control" id="nom" required>
        </div>

        <div class="col-md-6">
            <label for="dateNaissance" class="form-label">Date de naissance :</label>
            <input type="date" th:field="*{dateNaissance}" class="form-control" id="dateNaissance" required>
        </div>

        <div class="col-md-6">
            <label for="genre" class="form-label">Genre :</label>
            <select th:field="*{genre}" class="form-select" id="genre">
                <option value="HOMME">Homme</option>
                <option value="FEMME">Femme</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="adresse" class="form-label">Adresse :</label>
            <input type="text" th:field="*{adresse}" class="form-control" id="adresse">
        </div>

        <div class="col-md-6">
            <label for="telephone" class="form-label">Téléphone :</label>
            <input type="text" th:field="*{telephone}" class="form-control" id="telephone">
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/patients}" class="btn btn-secondary ms-2">← Retour à la liste</a>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
