<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des patients</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>Liste des patients</h1>

<div th:if="${successMessage}" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
    <p th:text="${successMessage}"></p>
</div>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Date de naissance</th>
        <th>Genre</th>
        <th>Détails</th>
        <th>Modifier</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="patient : ${patients}">
        <td th:text="${patient.id}"></td>
        <td th:text="${patient.nom}"></td>
        <td th:text="${patient.prenom}"></td>
        <td th:text="${patient.dateNaissance}"></td>
        <td th:text="${patient.genre}"></td>
        <td><a th:href="@{'/patients/' + ${patient.id}}">Voir</a></td>
        <td><a th:href="@{'/patients/' + ${patient.id} + '/edit'}">Modifier</a></td>
    </tr>
    </tbody>
</table>

</body>
</html>
