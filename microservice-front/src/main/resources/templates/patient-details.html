<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails du patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

       /* Aucun risque (Vert) */
       .risk-none {
           color: #38761D;!important /* Vert foncé */
           font-weight: bold;
       }

       /* Risque limité (Orange clair) */
       .risk-borderline {
           color: #E69138; !important  /* Orange standard */
           font-weight: bold;
       }

       /* Danger (Orange Foncé, plus proche du Rouge) */
       .risk-in-danger {
           color: #CC6600; !important  /* Orange Brûlé / Foncé */
           font-weight: bold;
       }

       /* Apparition précoce (Rouge Vif/Urgent) */
       .risk-early-onset {
           color: #990000; !important  /* Rouge profond/vif */
           font-weight: bold;
       }
    </style>

</head>

<body class="bg-light">

<div class="container my-5">

    <h1 class="text-primary mb-4">Détails du patient</h1>

    <!-- Informations patient -->
    <div class="card shadow-sm mb-4 p-4">
        <h3 th:text="${patient.prenom + ' ' + patient.nom}"></h3>
        <p><strong>Date de naissance :</strong> <span th:text="${patient.dateNaissance}"></span></p>
        <p><strong>Genre :</strong> <span th:text="${patient.genre}"></span></p>
        <p><strong>Adresse :</strong> <span th:text="${patient.adresse}"></span></p>
        <p><strong>Téléphone :</strong> <span th:text="${patient.telephone}"></span></p>
    </div>

    <hr/>

    <!-- Bloc rapport de diabète -->
    <h2 class="mt-4">Risque de diabète</h2>

    <div class="alert alert-info mt-3">

        <p><strong>Âge :</strong> <span th:text="${age}"></span></p>

        <p><strong>Déclencheurs :</strong> <span th:text="${triggerCount}"></span></p>

        <p>
            <strong>Niveau de risque :</strong>
            <span th:text="${riskLevel}"
                  th:classappend="${riskLevel != null} ? 'risk-' + ${riskLevel.toLowerCase().replace(' ', '-')} : 'risk-indisponible'">
        </span>
        </p>
    </div>

    <a th:href="@{'/patients/' + ${patient.id} + '/assess'}"
       class="btn btn-outline-primary mt-2">
        Voir rapport détaillé →
    </a>

    <hr/>

    <!-- Notes du patient -->
    <h2 class="mt-4">Notes médicales</h2>

    <div th:if="${notes == null or #lists.isEmpty(notes)}" class="mt-2">
        <em>Aucune note trouvée.</em>
    </div>

    <ul class="list-group mt-3" th:each="note : ${notes}">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span th:text="${note.note}"></span>

            <form th:action="@{/notes/delete/{id}(id=${note.id})}" method="post">
                <input type="hidden" name="patId" th:value="${patient.id}" />
                <button class="btn btn-danger btn-sm" type="submit">
                    Supprimer
                </button>
            </form>
        </li>
    </ul>

    <!-- Ajout d'une note -->
    <h3 class="mt-5">Ajouter une note</h3>

    <form th:action="@{/notes}" method="post" class="mt-3">
        <input type="hidden" name="patId" th:value="${patient.id}">
        <textarea name="note" class="form-control mb-3" placeholder="Ajouter une note..." required></textarea>
        <button type="submit" class="btn btn-success">Ajouter</button>
    </form>

    <div class="mt-4">
        <a href="/patients" class="btn btn-secondary">Retour à la liste</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
