<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détails du patient</title>
    <meta charset="UTF-8">
    <script>
        // Fonction pour supprimer une note via AJAX
        function deleteNote(noteId) {
            fetch('/api/notes/' + noteId, {
                method: 'DELETE'
            }).then(response => {
                if (response.status === 204) {
                    alert('Note supprimée');
                    location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            });
        }
    </script>
</head>
<body>

<h1>Détails du patient</h1>

<p><strong>Nom :</strong> <span th:text="${patient.nom}"></span></p>
<p><strong>Prénom :</strong> <span th:text="${patient.prenom}"></span></p>
<p><strong>Date de naissance :</strong> <span th:text="${patient.dateNaissance}"></span></p>
<p><strong>Genre :</strong> <span th:text="${patient.genre}"></span></p>
<p><strong>Adresse :</strong> <span th:text="${patient.adresse}"></span></p>
<p><strong>Téléphone :</strong> <span th:text="${patient.telephone}"></span></p>

<hr/>

<h2>Notes du patient</h2>

<div th:if="${notes == null or #lists.isEmpty(notes)}">
    Aucun note trouvé
</div>

<div th:each="note : ${notes}">
    <p>
        <span th:text="${note.note}"></span>
        <button
                th:attr="data-id=${note.id}"
                onclick="deleteNote(this.getAttribute('data-id'))">
            Supprimer
        </button>
    </p>
</div>

<script>
    function deleteNote(id) {
        fetch('/notes/' + id, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert("Erreur lors de la suppression");
                }
            })
            .catch(() => alert("Erreur lors de la suppression"));
    }
</script>



<hr/>

<h3>Ajouter une note</h3>
<form th:action="@{/notes}" method="post">
    <input type="hidden" name="patId" th:value="${patient.id}" />
    <input type="hidden" name="patient" th:value="${patient.nom}" />
    <textarea name="note" placeholder="Ajouter une note..." required></textarea>
    <br/>
    <button type="submit">Ajouter</button>
</form>
<a th:href="@{'/patients/' + ${patient.id} + '/assess'}" class="btn btn-secondary">
    Voir le rapport de diabète
</a>

<br/>
<a href="/patients">Retour à la liste</a>

</body>
</html>
